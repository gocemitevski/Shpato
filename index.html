  <main id="main" tabindex="-1">
    <!-- Catalogue -->
    <section id="view-catalog" class="view" role="tabpanel" aria-labelledby="tab-catalog">
      <div class="toolbar">
        <input id="search" class="search" type="search" autocomplete="off" data-i18n-label="search.label">
        <!-- Below the two-pane width the facet panel is a disclosure and this is
             its handle: the script shows it there and hides it where the panel
             is a permanent pane. Hidden in the markup so a wide window never
             flashes it. -->
        <button type="button" id="filters-toggle" class="btn filters-toggle"
                aria-expanded="true" aria-controls="filters" hidden>
          <span data-i18n="filters.title"></span>
          <span class="chev" aria-hidden="true">›</span>
        </button>
        <label class="check">
          <input type="checkbox" id="show-duplicates" checked>
          <span id="show-duplicates-label"></span>
        </label>
        <label class="check" id="only-video-wrap">
          <input type="checkbox" id="only-video">
          <span id="only-video-label"></span>
        </label>
      </div>

      <div class="layout">
        <div class="filters" id="filters" role="region" aria-labelledby="filters-title">
          <div class="filters-head">
            <h2 id="filters-title"></h2>
            <button type="button" id="clear-filters" class="link-btn"></button>
          </div>
          <div id="facet-category"></div>
          <div id="facet-collection"></div>
          <div id="facet-composer"></div>
          <div id="facet-performer"></div>

              <button type="button" role="menuitem" data-export="csv" data-i18n="export.optionCsv"></button>
              <button type="button" role="menuitem" data-export="json" data-i18n="export.optionJson"></button>
            </div>
          </div>
        </div>

        <div class="results">
          <p class="result-meta" id="result-meta" role="status"></p>
          <div class="table-wrap">
            <table class="catalog-table">
              <caption class="visually-hidden" data-i18n="catalog.caption"></caption>
              <thead>
                <tr>
                  <th scope="col" data-sort="title" class="sortable" aria-sort="ascending"><button type="button" class="th-sort"><span class="th-label"></span><span class="th-arrow" aria-hidden="true"></span></button></th>

                </tr>
              </thead>
              <tbody id="catalog-body"></tbody>
            </table>

          <p class="empty" id="catalog-empty" hidden></p>
