<!doctype html>
<html lang="mk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Драган Ѓаконовски – Шпато - Дигитален каталог</title>
  <meta name="description" content="Дигитален каталог на делата на Драган Ѓаконовски – Шпато во фонотеката на МРТВ.">

  <!-- The shipped value is the dark canvas. app.js rewrites it from
       --theme-color whenever the theme changes, so the browser chrome follows
       what is on screen rather than the OS guess. -->
  <meta name="theme-color" content="#0d1117">

  <link rel="icon" href="assets/images/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="assets/images/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/images/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">

  <!-- Social sharing. Crawlers do not resolve relative URLs, so every URL here
       is absolute. These tags are static on purpose: a crawler never runs the
       app's language toggle, so what it sees is the Macedonian default. -->
  <link rel="canonical" href="https://shpato.gocemitevski.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Драган Ѓаконовски – Шпато">
  <meta property="og:url" content="https://shpato.gocemitevski.com/">
  <meta property="og:title" content="Драган Ѓаконовски – Шпато - Дигитален каталог">
  <meta property="og:description" content="Дигитален каталог на делата на Драган Ѓаконовски – Шпато во фонотеката на МРТВ.">
  <meta property="og:locale" content="mk_MK">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:image" content="https://shpato.gocemitevski.com/assets/images/Dragan-Gjakonovski-Shpato-Cover.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="1080">
  <meta property="og:image:alt" content="Портрет на Драган Ѓаконовски – Шпато во син прстен, со насловот и адресата на дигиталниот каталог">

  <!-- X/Twitter. summary_large_image is what renders the cover full width; the
       platform would fall back to the og: tags above, but declaring them keeps
       the card explicit rather than incidental. -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Драган Ѓаконовски – Шпато - Дигитален каталог">
  <meta name="twitter:description" content="Дигитален каталог на делата на Драган Ѓаконовски – Шпато во фонотеката на МРТВ.">
  <meta name="twitter:image" content="https://shpato.gocemitevski.com/assets/images/Dragan-Gjakonovski-Shpato-Cover.png">
  <meta name="twitter:image:alt" content="Портрет на Драган Ѓаконовски – Шпато во син прстен, со насловот и адресата на дигиталниот каталог">

  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    (function () {
      try {
        var saved = localStorage.getItem("shpato-theme");
        var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>

  <header class="site-header">
    <a class="brand" href="index.html" id="home-link">
      <span class="brand-mark" aria-hidden="true">
        <img src="assets/images/Dragan-Gjakonovski-Shpato-Icon.webp" alt="" width="512" height="512">
      </span>
      <span class="brand-text">
        <h1 id="app-title"></h1>
        <p id="app-subtitle"></p>
      </span>
    </a>
    <div class="header-actions">
      <div class="theme-toggle" id="theme-toggle" role="group" data-i18n-label="theme.label">
        <button type="button" data-theme="light" aria-pressed="false">
          <svg class="toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4.6"/>
            <path d="M12 2.4v2.2M12 19.4v2.2M2.4 12h2.2M19.4 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/>
          </svg>
        </button>
        <button type="button" data-theme="dark" aria-pressed="false">
          <svg class="toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M21 13.1A9 9 0 1 1 10.9 3.1 7.4 7.4 0 0 0 21 13.1Z"/>
          </svg>
        </button>
      </div>
      <div class="lang-toggle" role="group" data-i18n-label="a11y.language">
        <button type="button" data-lang="mk">МК</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <nav class="tabs-nav" data-i18n-label="a11y.sections">
    <div class="tabs" id="tabs" role="tablist">
      <button type="button" role="tab" id="tab-catalog" data-tab="catalog" aria-controls="view-catalog" aria-selected="true"></button>
      <button type="button" role="tab" id="tab-stats" data-tab="stats" aria-controls="view-stats" aria-selected="false" tabindex="-1"></button>
      <button type="button" role="tab" id="tab-anomalies" data-tab="anomalies" aria-controls="view-anomalies" aria-selected="false" tabindex="-1"></button>
    </div>
  </nav>

  <main id="main" tabindex="-1">
    <!-- Catalogue -->
    <section id="view-catalog" class="view" role="tabpanel" aria-labelledby="tab-catalog">
      <div class="toolbar">
        <input id="search" class="search" type="search" autocomplete="off" data-i18n-label="search.label">
        <label class="check">
          <input type="checkbox" id="show-duplicates">
          <span id="show-duplicates-label"></span>
        </label>
      </div>

      <div class="layout">
        <div class="filters" id="filters" role="region" aria-labelledby="filters-title">
          <div class="filters-head">
            <h2 id="filters-title"></h2>
            <button type="button" id="clear-filters" class="link-btn"></button>
          </div>
          <div id="facet-category"></div>
          <div id="facet-collection"></div>
          <div id="facet-composer"></div>
          <div id="facet-performer"></div>
          <div id="facet-duration"></div>
          <div class="export">
            <button type="button" id="export-btn" class="btn export-btn"
                    aria-haspopup="true" aria-expanded="false" aria-controls="export-menu">
              <span data-i18n="export.label"></span>
              <span class="chev" aria-hidden="true">›</span>
            </button>
            <div class="menu" id="export-menu" role="menu" data-i18n-label="export.label" hidden>
              <button type="button" role="menuitem" data-export="csv" data-i18n="export.optionCsv"></button>
              <button type="button" role="menuitem" data-export="json" data-i18n="export.optionJson"></button>
            </div>
          </div>
        </div>

        <div class="results">
          <p class="result-meta" id="result-meta" role="status"></p>
          <div class="table-wrap">
            <table class="catalog-table">
              <caption class="visually-hidden" data-i18n="catalog.caption"></caption>
              <thead>
                <tr>
                  <th scope="col" data-sort="title" class="sortable" aria-sort="ascending"><button type="button" class="th-sort"><span class="th-label"></span><span class="th-arrow" aria-hidden="true"></span></button></th>
                  <th scope="col" data-sort="performer" class="sortable"><button type="button" class="th-sort"><span class="th-label"></span><span class="th-arrow" aria-hidden="true"></span></button></th>
                  <th scope="col" data-sort="composer" class="sortable"><button type="button" class="th-sort"><span class="th-label"></span><span class="th-arrow" aria-hidden="true"></span></button></th>
                  <th scope="col" data-sort="durationSec" class="sortable"><button type="button" class="th-sort"><span class="th-label"></span><span class="th-arrow" aria-hidden="true"></span></button></th>
                  <th scope="col" data-sort="signature" class="sortable"><button type="button" class="th-sort"><span class="th-label"></span><span class="th-arrow" aria-hidden="true"></span></button></th>
                </tr>
              </thead>
              <tbody id="catalog-body"></tbody>
            </table>
          </div>
          <p class="empty" id="catalog-empty" hidden></p>
        </div>
      </div>
    </section>

    <!-- Statistics -->
    <section id="view-stats" class="view" role="tabpanel" aria-labelledby="tab-stats" tabindex="0" hidden>
      <h2 class="section-title" data-i18n="tab.stats"></h2>
      <div id="stat-cards" class="cards"></div>
      <div class="charts">
        <div class="chart-block">
          <h3 data-i18n="stats.byCategory"></h3>
          <div id="chart-category" class="bars"></div>
        </div>
        <div class="chart-block">
          <h3 data-i18n="stats.byCollection"></h3>
          <div id="chart-collection" class="bars"></div>
        </div>
        <div class="chart-block">
          <h3 data-i18n="stats.topPerformers"></h3>
          <div id="chart-performers" class="bars"></div>
        </div>
        <div class="chart-block">
          <h3 data-i18n="stats.topComposers"></h3>
          <div id="chart-composers" class="bars"></div>
        </div>
        <div class="chart-block wide">
          <h3 data-i18n="stats.durationDist"></h3>
          <div id="chart-duration" class="bars"></div>
        </div>
      </div>
    </section>

    <!-- Data notes -->
    <section id="view-anomalies" class="view" role="tabpanel" aria-labelledby="tab-anomalies" hidden>
      <h2 class="section-title" data-i18n="anom.title"></h2>
      <p class="intro" data-i18n="anom.intro"></p>
      <div id="anomaly-summary" class="summary"></div>
      <div class="toolbar">
        <label class="field">
          <span data-i18n="anom.severity"></span>
          <select id="anomaly-severity">
            <option value=""></option>
            <option value="warning"></option>
            <option value="info"></option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="anom.rule"></span>
          <select id="anomaly-rule"></select>
        </label>
      </div>
      <div class="table-wrap">
        <table class="catalog-table anomalies-table">
          <caption class="visually-hidden" data-i18n="anom.caption"></caption>
          <thead>
            <tr>
              <th scope="col" data-i18n="anom.record"></th>
              <th scope="col" data-i18n="anom.rule"></th>
              <th scope="col" data-i18n="anom.severity"></th>
              <th scope="col" data-i18n="anom.rawShort"></th>
              <th scope="col" data-i18n="anom.normalized"></th>
              <th scope="col" data-i18n="anom.source"></th>
            </tr>
          </thead>
          <tbody id="anomaly-body"></tbody>
        </table>
      </div>
      <p class="empty" id="anomaly-empty" hidden></p>
      <div id="anomaly-more" class="table-more"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="footer-credit">
      <span data-i18n="app.credit"></span>
      <a href="https://www.gocemitevski.com" target="_blank" rel="noopener">Гоце Митевски</a>
    </p>
    <p class="footer-note" id="footer-note"></p>
  </footer>

  <!-- Detail drawer -->
  <div id="drawer" class="drawer" hidden>
    <div class="drawer-backdrop" data-close></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <button type="button" class="drawer-close" data-close data-i18n-label="a11y.close">×</button>
      <div id="drawer-content"></div>
    </div>
  </div>

  <script src="data/catalog.js"></script>
  <script src="data/anomalies.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
