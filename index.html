<head>
  <meta charset="utf-8">
  <!-- resizes-content: on a phone the on-screen keyboard shrinks the layout
       viewport instead of floating over it, so the shell (100dvh) shrinks with
       it and the results stay visible above the keyboard rather than behind it.
       Unknown viewport keys are ignored, so browsers without it are unaffected. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">

  <!-- Matomo, cookieless. The instance enforces "tracking without cookies" and
       the tracker is told the same, so no analytics cookie is written. The
       fragment is discarded because the catalogue keeps its state there, search
       text included, and Matomo would otherwise record it as part of the page
       URL. Only http(s) loads it: on file:// the absolute analytics URL would
       track a local read of the catalogue, and the app must keep working from
       disk. -->
  <script>
    if (location.protocol === "http:" || location.protocol === "https:") {
      var _paq = window._paq = window._paq || [];
      /* Both must be queued before trackPageView, or the first page view is the
         one that sets a cookie or carries the hash. */
      _paq.push(["disableCookies"]);
      _paq.push(["discardHashTag", true]);
      _paq.push(["trackPageView"]);
      _paq.push(["enableLinkTracking"]);
      (function () {
        var u = "https://analytics.gocemitevski.com/";
        _paq.push(["setTrackerUrl", u + "matomo.php"]);
        _paq.push(["setSiteId", "3"]);
        var d = document, g = d.createElement("script"), s = d.getElementsByTagName("script")[0];
        g.async = true;
        g.src = u + "matomo.js";
        s.parentNode.insertBefore(g, s);
      })();
    }
  </script>

  <link rel="canonical" href="https://shpato.gocemitevski.com/">

       document and this says which one to keep. A self-referential canonical

       keeps crawlers off /index.html for the same reason. -->
  <meta property="og:type" content="website">

  <script>
    /* Apply the saved theme before first paint to avoid a flash, and hold the
       shell back until app.js has written its labels. Every string in it comes
       from assets/i18n.js, so a shell painted before the app runs is an empty
       one, and it moves when the labels land: Lighthouse measured CLS 0.88 on a
       phone for exactly that. app.js clears both classes — the first once the
       labels are in, the second once the catalogue has rendered, because the
       footer on a phone sits where 433 rows are about to arrive. The timer is
       the way out if the app never runs at all, and it stays out of the way of
       a slow one. */
    (function () {
      var root = document.documentElement;
      root.classList.add("boot-shell", "boot-foot");
      setTimeout(function () {
        if (!window.SHPATO_STARTED) root.classList.remove("boot-shell", "boot-foot");
      }, 4000);
      try {
        var saved = localStorage.getItem("shpato-theme");
        var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        root.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>

    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <button type="button" class="drawer-close" data-close data-i18n-label="a11y.close">×</button>
      <div id="drawer-content"></div>
    </div>
  </div>

  <!-- YouTube mini-player. It sits outside the drawer on purpose: a work keeps
       playing while its details are open and while the catalogue is filtered. -->
  <div id="player" class="player" role="region" data-i18n-label="player.label" hidden>
    <div class="player-frame" id="player-frame"></div>
    <div class="player-bar">
      <div class="player-meta">
        <span class="player-title" id="player-title"></span>
        <span class="player-sub" id="player-sub"></span>
        <a class="player-link" id="player-link" href="#" target="_blank" rel="noopener"
           data-i18n="player.watch"></a>
      </div>
      <button type="button" class="player-close" id="player-close"
              data-i18n-label="player.close">×</button>
    </div>
  </div>

  <!-- The order is load-bearing twice over: i18n before app, so the shell can be
       labelled without waiting for the catalogue, and the catalogue fetched by
       app.js only after that, so its 40 KB is not in the same burst as these
       two. fetchpriority: without it these sit behind the two font files, which
       are 42 KB, and the shell stays unlabelled while a typeface it does not
       need yet arrives ahead of it. notes.js is 145 KB that only the Забелешки
       tab reads, so app.js fetches it when that tab is first opened. -->
  <script src="assets/i18n.min.js" fetchpriority="high"></script>
  <script src="assets/app.min.js" fetchpriority="high"></script>
</body>
</html>
