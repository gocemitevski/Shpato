<!doctype html>
<html lang="mk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Драган Ѓаконовски – Шпато · Дигитален каталог</title>
  <meta name="description" content="Дигитален каталог на делата на Драган Ѓаконовски – Шпато во фонотеката на МРТВ.">
  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    (function () {
      try {
        var saved = localStorage.getItem("shpato-theme");
        var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#view-catalog">Skip to content</a>

  <header class="site-header">
    <a class="brand" href="index.html" id="home-link">
      <span class="brand-mark" aria-hidden="true">Ш</span>
      <span class="brand-text">
        <h1 id="app-title"></h1>
        <p id="app-subtitle"></p>
      </span>
    </a>
    <div class="header-actions">
      <div class="theme-toggle" id="theme-toggle" role="group">
        <button type="button" data-theme="light" aria-pressed="false">☀</button>
        <button type="button" data-theme="dark" aria-pressed="false">☾</button>
      </div>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-lang="mk">МК</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <button type="button" data-tab="catalog"></button>
    <button type="button" data-tab="stats"></button>
    <button type="button" data-tab="anomalies"></button>
  </nav>

  <main>
    <!-- Catalogue -->
    <section id="view-catalog" class="view">
      <div class="toolbar">
        <input id="search" class="search" type="search" autocomplete="off">
        <label class="check">
          <input type="checkbox" id="show-duplicates">
          <span id="show-duplicates-label"></span>
        </label>
      </div>

      <div class="layout">
        <aside class="filters" id="filters">
          <div class="filters-head">
            <h2 id="filters-title"></h2>
            <button type="button" id="clear-filters" class="link-btn"></button>
          </div>
          <div id="facet-category"></div>
          <div id="facet-collection"></div>
          <div id="facet-composer"></div>
          <div id="facet-performer"></div>
          <div id="facet-duration"></div>
          <div class="export">
            <button type="button" id="export-btn" class="btn export-btn"
                    aria-haspopup="true" aria-expanded="false" aria-controls="export-menu">
              <span data-i18n="export.label"></span>
              <span class="chev" aria-hidden="true">›</span>
            </button>
            <div class="menu" id="export-menu" role="menu" hidden>
              <button type="button" role="menuitem" data-export="csv" data-i18n="export.optionCsv"></button>
              <button type="button" role="menuitem" data-export="json" data-i18n="export.optionJson"></button>
            </div>
          </div>
        </aside>

        <div class="results">
          <p class="result-meta" id="result-meta"></p>
          <div class="table-wrap">
            <table class="catalog-table">
              <thead>
                <tr>
                  <th data-sort="title" class="sortable"></th>
                  <th data-sort="performer" class="sortable"></th>
                  <th data-sort="composer" class="sortable"></th>
                  <th data-sort="durationSec" class="sortable"></th>
                  <th data-sort="signature" class="sortable"></th>
                </tr>
              </thead>
              <tbody id="catalog-body"></tbody>
            </table>
          </div>
          <p class="empty" id="catalog-empty" hidden></p>
        </div>
      </div>
    </section>

    <!-- Statistics -->
    <section id="view-stats" class="view" hidden>
      <div id="stat-cards" class="cards"></div>
      <div class="charts">
        <div class="chart-block">
          <h3 data-i18n="stats.byCategory"></h3>
          <div id="chart-category" class="bars"></div>
        </div>
        <div class="chart-block">
          <h3 data-i18n="stats.byCollection"></h3>
          <div id="chart-collection" class="bars"></div>
        </div>
        <div class="chart-block">
          <h3 data-i18n="stats.topPerformers"></h3>
          <div id="chart-performers" class="bars"></div>
        </div>
        <div class="chart-block">
          <h3 data-i18n="stats.topComposers"></h3>
          <div id="chart-composers" class="bars"></div>
        </div>
        <div class="chart-block wide">
          <h3 data-i18n="stats.durationDist"></h3>
          <div id="chart-duration" class="bars"></div>
        </div>
      </div>
    </section>

    <!-- Data notes -->
    <section id="view-anomalies" class="view" hidden>
      <h2 class="section-title" data-i18n="anom.title"></h2>
      <p class="intro" data-i18n="anom.intro"></p>
      <div id="anomaly-summary" class="summary"></div>
      <div class="toolbar">
        <label class="field">
          <span data-i18n="anom.severity"></span>
          <select id="anomaly-severity">
            <option value=""></option>
            <option value="warning"></option>
            <option value="info"></option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="anom.rule"></span>
          <select id="anomaly-rule"></select>
        </label>
      </div>
      <div class="table-wrap">
        <table class="catalog-table anomalies-table">
          <thead>
            <tr>
              <th data-i18n="anom.record"></th>
              <th data-i18n="anom.rule"></th>
              <th data-i18n="anom.severity"></th>
              <th data-i18n="anom.rawShort"></th>
              <th data-i18n="anom.normalized"></th>
              <th data-i18n="anom.source"></th>
            </tr>
          </thead>
          <tbody id="anomaly-body"></tbody>
        </table>
      </div>
      <p class="empty" id="anomaly-empty" hidden></p>
      <div id="anomaly-more" class="table-more"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>
      <span id="footer-source"></span>
    </p>
    <p class="footer-note" id="footer-note"></p>
  </footer>

  <!-- Detail drawer -->
  <div id="drawer" class="drawer" hidden>
    <div class="drawer-backdrop" data-close></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <button type="button" class="drawer-close" data-close aria-label="Close">×</button>
      <div id="drawer-content"></div>
    </aside>
  </div>

  <script src="data/catalog.js"></script>
  <script src="data/anomalies.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
