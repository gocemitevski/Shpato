<!doctype html>
<!--
  Social share cover, 1920x1080.

  Render to a PNG with headless Chrome, e.g.

    google-chrome --headless=new --hide-scrollbars \
      --window-size=1920,1080 --screenshot=cover.png \
      file:///path/to/tools/cover.html

  This page is a render target only: index.html never loads it. It links the
  app stylesheet so the palette, the Geologica face and the brand mark stay in
  step with the site instead of drifting from it. It renders in the app's dark
  theme, whose canvas lets the accent halo read.
-->
<html lang="mk" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Драган Ѓаконовски – Шпато · Cover 1920×1080</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: var(--bg);
      /* A soft accent bloom behind the mark, well under full strength so the
         text below it keeps its contrast. Centred on the content rather than
         the canvas so the composition does not read as top-heavy. */
      background-image: radial-gradient(
        72% 62% at 50% 42%,
        color-mix(in srgb, var(--accent) 13%, transparent),
        transparent 78%
      );
    }

    .cover {
      width: 1920px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* The brand mark, matching .brand-mark in the app: accent ring, the
       portrait, and the accent halo. Only the scale differs — the ring and the
       halo are the header's 42px values scaled by 280/42. The portrait is left
       uncropped so this is the same mark the site shows. */
    .cover-mark {
      width: 280px;
      height: 280px;
      padding: 13px;
      border-radius: 50%;
      background: var(--accent);
      overflow: hidden;
      flex: none;
      box-shadow: 0 33px 147px -13px color-mix(in srgb, var(--accent) 50%, transparent);
    }
    .cover-mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .cover-name {
      margin: 60px 0 0;
      font-size: 96px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -.02em;
      color: var(--ink);
    }
    .cover-tagline {
      margin: 26px 0 0;
      font-size: 36px;
      line-height: 1.4;
      color: var(--muted);
    }
    /* width: fit-content keeps the chip hugging the URL instead of stretching
       to the width of the block, which is what a block-level <p> would do. */
    .cover-url {
      width: fit-content;
      margin: 44px auto 0;
      padding: .3em .9em;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: .01em;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="cover">
    <span class="cover-mark" aria-hidden="true">
      <img src="../assets/images/Dragan-Gjakonovski-Shpato-Icon.webp" alt="">
    </span>
    <div class="cover-text">
      <h1 class="cover-name">Драган Ѓаконовски – Шпато</h1>
      <p class="cover-tagline">Дигитален каталог на делата во фонотеката на МРТВ</p>
      <p class="cover-url">shpato.gocemitevski.com</p>
    </div>
  </div>
</body>
</html>
